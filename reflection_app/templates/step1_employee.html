{% extends "base.html" %}
{% set current_step = 1 %}
{% block content %}
<div class="form-card" style="max-width:600px;margin:24px auto;">
  <div class="card-title">👤 Select Your Employee Profile</div>
  <p class="text-muted" style="font-size:.9rem;margin-bottom:20px;">
    Choose your Employee ID and Name from the list below to begin.
  </p>
  <form method="POST" action="/step2">
    <div class="mb-4">
      <label class="form-label fw-semibold">Employee ID — Name</label>
      <select name="emp_code" class="form-select form-select-lg" required
              style="font-size:.95rem;">
        <option value="" disabled selected>— Search and select employee —</option>
        {% for emp in employees %}
        <option value="{{ emp.emp_code }}">
          {{ emp.emp_code }} — {{ emp.emp_name }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="d-flex justify-content-end">
      <button type="submit" class="btn-primary-custom btn">
        Next &rarr;
      </button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Simple search filter for the select
  const sel = document.querySelector('select[name=emp_code]');
  sel.addEventListener('keydown', function(e) {
    // native select already supports first-letter search
  });
</script>
{% endblock %}
